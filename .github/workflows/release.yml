name: Release Windows App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma Client
        run: npx prisma generate
        
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $null = gh release view ${{ github.ref_name }} 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --title "Release ${{ github.ref_name }} — Full Server Restore" --notes "### Release ${{ github.ref_name }} — Full Server Restore`n`n- **Full Server Restore Engine**: Automatically clone the quarry database from the cloud to a fresh PC.`n- **Disaster Recovery UI**: Interactive dialog with table row counts and overwrite protection.`n- **Auto-Cursor Healing**: Background synchronization resumes seamlessly after a restore."
          }

      - name: Build and Publish Electron App
        run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Blockmap Asset Is Uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} (Get-Item release-v2\*.blockmap).FullName --clobber

      - name: Verify Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view ${{ github.ref_name }} --json assets --jq ".assets[].name"
          Write-Host "Verified Assets in Release:"
          $assets


