name: Release Windows App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma Client
        run: npx prisma generate

      # ── IMPORTANT: Create a draft release BEFORE electron-builder ──
      # We create a draft release first, and configure electron-builder (in package.json)
      # with releaseType: "draft". This forces electron-builder to upload assets to
      # our existing draft release. This prevents a known concurrency race condition where
      # electron-builder creates duplicate releases when publishing multiple assets.

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $null = gh release view ${{ github.ref_name }} 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Found pre-existing release for ${{ github.ref_name }}. Deleting it first..."
            gh release delete ${{ github.ref_name }} --yes
          }
          Write-Host "Creating Draft Release for ${{ github.ref_name }}..."
          gh release create ${{ github.ref_name }} --draft --title "Release ${{ github.ref_name }}" --notes "### Release ${{ github.ref_name }}`n`nSee [CHANGELOG](https://github.com/judahwilson-v/MBM-Quarry-ERP/blob/main/docs/CHANGELOG.md) for details."

      - name: Build and Publish Electron App
        run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Blockmap Asset Is Uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} (Get-Item release-v2\*.blockmap).FullName --clobber



      - name: Verify Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view ${{ github.ref_name }} --json assets --jq ".assets[].name"
          Write-Host "Verified Assets in Release:"
          $assets
          # Fail the workflow if latest.yml is missing
          $hasLatestYml = $assets | Select-String -Pattern "latest.yml"
          if (-not $hasLatestYml) {
            Write-Error "FATAL: latest.yml is missing from the release! Auto-update will not work."
            exit 1
          }

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false

