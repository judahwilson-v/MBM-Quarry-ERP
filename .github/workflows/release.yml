name: Release Windows App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate Prisma Client
        run: npx prisma generate

      # ── IMPORTANT: Do NOT create a release before electron-builder ──
      # electron-builder -p always creates its own draft release and uploads
      # latest.yml, the .exe, and .blockmap to it. If a release (draft or
      # published) already exists for this tag, electron-builder will get a
      # 422 "already_exists" error and fail — leaving latest.yml missing.
      # We let electron-builder go first, then add notes and publish after.

      - name: Delete Pre-existing Release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $null = gh release view ${{ github.ref_name }} 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Found pre-existing release for ${{ github.ref_name }}. Deleting to avoid clash with electron-builder..."
            gh release delete ${{ github.ref_name }} --yes
          } else {
            Write-Host "No pre-existing release found. Proceeding."
          }
          exit 0

      - name: Build and Publish Electron App
        run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Blockmap Asset Is Uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} (Get-Item release-v2\*.blockmap).FullName --clobber

      - name: Add Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.ref_name }} --title "Release ${{ github.ref_name }}" --notes "### Release ${{ github.ref_name }}`n`nSee [CHANGELOG](https://github.com/judahwilson-v/MBM-Quarry-ERP/blob/main/docs/CHANGELOG.md) for details."

      - name: Verify Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view ${{ github.ref_name }} --json assets --jq ".assets[].name"
          Write-Host "Verified Assets in Release:"
          $assets
          # Fail the workflow if latest.yml is missing
          $hasLatestYml = $assets | Select-String -Pattern "latest.yml"
          if (-not $hasLatestYml) {
            Write-Error "FATAL: latest.yml is missing from the release! Auto-update will not work."
            exit 1
          }

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false

